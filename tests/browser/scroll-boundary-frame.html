<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>스크롤 경계 테스트 대상</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;font:14px/1.5 sans-serif}
#screen{height:100%;position:relative}#toolbar{height:61px;box-sizing:border-box;padding:20px;background:#ede9fe}
#gjs,.logic-panel{position:absolute;left:30px;top:61px;width:calc(100% - 420px);height:calc(100% - 70px);overflow:hidden}
.gjs-frame{width:100%;height:100%;border:0;display:block;transform-origin:0 0}
.logic-panel{overflow:auto;background:#f8fafc}.logic_wrap{display:flex}.logic_area{flex:1}
.logic-row{height:40px;border-bottom:1px solid #ddd}.gap{height:1800px}
#popup{height:152px;overflow:hidden}
.panel__results{position:fixed;right:30px;bottom:30px;width:280px;height:160px;overflow:auto;border:1px solid #aaa;background:white}
</style>
<div id="screen"><div id="toolbar">이 도구 모음의 위치가 유지되어야 합니다.</div>
<div id="gjs"><iframe class="gjs-frame" title="합성 캔버스"></iframe></div>
<div class="logic-panel" hidden><div class="logic_wrap"><div class="logic_seq_area">1</div><div class="logic_area"><div class="gap"></div><div class="logic-row" data-genie-target-id="logic-bottom">검색한 로직</div><div class="gap"></div></div></div></div>
</div><div id="popup"></div>
<div class="panel__results"><div class="gap"></div><button id="list-result">검색 목록 마지막 결과</button></div>
<script type="module" src="./scroll-boundary.js"></script>
</html>
