<!doctype html>
<html lang="ko">
<meta charset="utf-8" />
<title>Visual search fixture</title>
<style>
    body { margin: 24px; font: 14px/1.5 sans-serif; background: #f1f5f9; }
    h1 { font-size: 20px; } button { cursor: pointer; }
    #gjs { width: min(900px, calc(100vw - 410px)); height: 510px; overflow: hidden; background: white; border: 1px solid #94a3b8; }
    .gjs-frame { width: 100%; height: 100%; border: 0; transform-origin: 0 0; }
    body #lamp7-genie-root { position: fixed; right: 24px; top: 88px; width: 280px; background: white; box-shadow: 0 8px 35px #0f172a22; padding: 14px; border-radius: 12px; }
    #notice { padding: 8px; color: #9a3412; } #checks { white-space: pre-wrap; }
</style>
<h1>Visual editor 검색 — 합성 데이터 검증</h1>
<p>실제 Lamp7 서버와 연결하지 않는 테스트입니다. 검색어: 고객, OrderNo, 숨김</p>
<p><button id="verify">원본 유지 검사</button> <button id="zoom">캔버스 80% / 100%</button>
<button id="remove">고객 항목 삭제(테스트)</button> <button id="undo">고객 항목 복원(테스트)</button>
<button id="unmount">패널 닫기</button></p>
<div id="gjs"><iframe class="gjs-frame" title="합성 Lamp7 캔버스"></iframe></div>
<pre id="checks">테스트 준비 중…</pre>
<div id="lamp7-genie-root"><div id="notice" role="status"></div><div id="panel"></div></div>
<script type="module" src="./visual-search.jsx"></script>
</html>
